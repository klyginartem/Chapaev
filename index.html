<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чапаев — последний бой!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        #game-container {
            width: 1080px;
            height: 2400px;
            position: relative;
            background-color: #1a1a1a;
            overflow: hidden;
            transition: transform 0.1s ease;
            transform-origin: top left;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .screen.active {
            display: block;
        }

        @media (max-width: 1080px) {
            body {
                overflow: hidden;
            }
            #game-container {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
        }

        #screen_start {
            background: url('assets/images/Screen_start.png') no-repeat center center;
            background-size: cover;
        }

        #screen_settings {
            background: url('assets/images/Screen_settings.png') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        #screen_game {
            background: url('assets/images/Screen_game.png') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        #screen_final_win {
            background: url('assets/images/Screen_final_win.png') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        #screen_final_lost {
            background: url('assets/images/Screen_final_lost.png') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        #screen_info {
            background: url('assets/images/Screen_info.png') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        /* ========== ЭКРАН НАСТРОЕК ========== */
        .choice-image {
            width: 600px;
            height: auto;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        .arrow-btn {
            cursor: pointer;
            transition: transform 0.2s;
            width: 80px;
            height: auto;
            display: block;
            transform: translateY(155px);
        }

        .arrow-btn:active {
            transform: translateY(155px) scale(0.9);
        }

        .choice-group {
            position: relative;
            width: 600px;
            height: auto;
        }

        .choice-group .choice-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
        }

        .block-field {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 800px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }

        .block-player {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 1100px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }

        .block-sound {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 1400px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }

        .info-btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            transition: transform 0.2s;
            width: 100px;
            height: auto;
            bottom: 550px;
        }

        .info-btn:active {
            transform: translateX(-50%) scale(0.9);
        }

        .fight-btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            transition: transform 0.2s;
            width: 600px;
            height: auto;
            bottom: 300px;
        }

        .fight-btn:active {
            transform: translateX(-50%) scale(0.9);
        }

        /* ========== ЭКРАН ИГРЫ ========== */
        .game-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 550px;
            padding-bottom: 100px;
        }

        .top-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 45px;
            margin-bottom: 30px;
        }

        .top-panel img {
            height: 100px;
            width: auto;
        }

        .turn-indicator {
            position: relative;
            width: 400px;
            height: 70px;
        }

        .turn-indicator img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
        }

        .score-block {
            display: flex;
            justify-content: space-between;
            width: 700px;
            margin-bottom: 50px;
        }

        .score-left, .score-right {
            font-size: 50px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px black;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
        }

        .game-table {
            width: 800px;
            height: auto;
            display: block;
        }

        .rotate-block {
            display: flex;
            justify-content: center;
            gap: 650px;
            margin-bottom: 50px;
        }

        .rotate-btn {
            cursor: pointer;
            transition: transform 0.2s;
            width: 80px;
            height: auto;
        }

        .rotate-btn:active {
            transform: scale(0.9);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .resume-btn, .menu-btn {
            cursor: pointer;
            transition: transform 0.2s;
            width: 500px;
            height: auto;
        }

        .resume-btn:active, .menu-btn:active {
            transform: scale(0.9);
        }

        /* Контейнер для сдвига */
        #game-scroll-container {
            position: relative;
            width: 800px;
            margin-bottom: 50px;
            transition: transform 0.3s ease-out;
        }

        #game-board-container {
            position: relative;
            width: 100%;
        }

        #stones-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .stone {
            position: absolute;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 200;
            pointer-events: auto;
        }

        .stone:active {
            transform: scale(0.95);
        }

        .stone img {
            width: 100%;
            height: auto;
            display: block;
        }

        .aim-line {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
            transform-origin: left center;
        }

        .final-btn {
            cursor: pointer;
            transition: transform 0.2s;
            width: 500px;
            height: auto;
            position: absolute;
            bottom: 300px;
            left: 50%;
            transform: translateX(-50%);
        }

        .final-btn:active {
            transform: translateX(-50%) scale(0.9);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="screen_start" class="screen active"></div>

        <div id="screen_settings" class="screen">
            <div class="block-field">
                <img src="assets/images/Button_left_1_1.png" alt="Влево" class="arrow-btn" id="btn-field-left">
                <div class="choice-group" id="field-group">
                    <img src="assets/images/Sign_choose_game_field_Last_fight.png" alt="Два игрока" id="field-last" class="choice-image">
                    <img src="assets/images/Sign_choose_game_field_Straight_attack.png" alt="Против компьютера" id="field-straight" class="choice-image hidden">
                </div>
                <img src="assets/images/Button_right_1_2.png" alt="Вправо" class="arrow-btn" id="btn-field-right">
            </div>

            <div class="block-player">
                <img src="assets/images/Button_left_2_1.png" alt="Влево" class="arrow-btn" id="btn-player-left">
                <div class="choice-group" id="player-group">
                    <img src="assets/images/Button_choose_player_red.png" alt="Красные" id="player-red" class="choice-image">
                    <img src="assets/images/Button_choose_player_white.png" alt="Белые" id="player-white" class="choice-image hidden">
                    <img src="assets/images/Button_choose_player_cases.png" alt="Случайно" id="player-cases" class="choice-image hidden">
                </div>
                <img src="assets/images/Button_right_2_2.png" alt="Вправо" class="arrow-btn" id="btn-player-right">
            </div>

            <div class="block-sound">
                <img src="assets/images/Button_left_3_1.png" alt="Влево" class="arrow-btn" id="btn-sound-left">
                <div class="choice-group" id="sound-group">
                    <img src="assets/images/Button_choose_sound_on.png" alt="Звук вкл" id="sound-on" class="choice-image">
                    <img src="assets/images/Button_choose_sound_off.png" alt="Звук выкл" id="sound-off" class="choice-image hidden">
                </div>
                <img src="assets/images/Button_right_3_2.png" alt="Вправо" class="arrow-btn" id="btn-sound-right">
            </div>

            <img src="assets/images/button_info.png" alt="Информация" class="info-btn" id="btn-info">
            <img src="assets/images/Button_to_fight.png" alt="Сражаться" class="fight-btn" id="btn-to-fight">
        </div>

        <div id="screen_game" class="screen">
            <div class="game-content">
                <div class="top-panel">
                    <img src="assets/images/Label_star.png" alt="Звезда" class="star-icon">
                    <div class="turn-indicator" id="turn-indicator">
                        <img src="assets/images/Sign_turn_red.png" alt="Ход красных" id="turn-red">
                        <img src="assets/images/Sign_turn_white.png" alt="Ход белых" id="turn-white" class="hidden">
                    </div>
                    <img src="assets/images/Label_cross.png" alt="Крест" class="cross-icon">
                </div>

                <div class="score-block">
                    <div class="score-left" id="red-score">8/0</div>
                    <div class="score-right" id="white-score">8/0</div>
                </div>

                <div id="game-scroll-container">
                    <div id="game-board-container">
                        <img src="assets/images/GameTable.png" alt="Игровое поле" class="game-table" id="game-table">
                        <div id="stones-container"></div>
                    </div>
                </div>

                <div class="rotate-block">
                    <img src="assets/images/Button_turn_left.png" alt="Сдвинуть влево" class="rotate-btn" id="btn-move-left">
                    <img src="assets/images/Button_turn_right.png" alt="Сдвинуть вправо" class="rotate-btn" id="btn-move-right">
                </div>

                <div class="action-buttons">
                    <img src="assets/images/Button_resume.png" alt="Перезапуск" class="resume-btn" id="btn-resume">
                    <img src="assets/images/Button_to_menu_1.png" alt="В меню" class="menu-btn" id="btn-to-menu">
                </div>
            </div>
        </div>

        <div id="screen_final_win" class="screen">
            <img src="assets/images/Button_to_menu_3.png" alt="В меню" class="final-btn" id="btn-win-to-menu">
        </div>

        <div id="screen_final_lost" class="screen">
            <img src="assets/images/Button_to_menu_2.png" alt="В меню" class="final-btn" id="btn-lost-to-menu">
        </div>

        <div id="screen_info" class="screen">
            <img src="assets/images/Button_to_menu_4.png" alt="В меню" class="final-btn" id="btn-info-to-menu">
        </div>
    </div>

    <script>
        // ========== ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ ==========
        function switchScreen(screenId) {
            if (screenId !== 'screen_game') {
                if (gameLoopId) {
                    cancelAnimationFrame(gameLoopId);
                    gameLoopId = null;
                }
                isPhysicsRunning = false;
                isGameActive = false;
                removeAimLine();
                isDragging = false;
                selectedStone = null;
            }
            
            const screens = document.querySelectorAll('.screen');
            screens.forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                switchScreen('screen_settings');
            }, 3000);
        });

        // ========== ЗВУКИ ==========
        let isSoundEnabled = true;
        let beatSound = null;

        function playSound(soundFile) {
            if (!isSoundEnabled) return;
            
            try {
                if (soundFile === 'BeatSound.mp3') {
                    if (!beatSound) {
                        beatSound = new Audio(`assets/sounds/${soundFile}`);
                        beatSound.volume = 0.6;
                    } else {
                        beatSound.pause();
                        beatSound.currentTime = 0;
                    }
                    beatSound.play().catch(e => console.log(`[ЗВУК] Ошибка BeatSound: ${e.message}`));
                } else {
                    const audio = new Audio(`assets/sounds/${soundFile}`);
                    audio.volume = 0.6;
                    audio.play().catch(e => console.log(`[ЗВУК] Ошибка: ${soundFile} - ${e.message}`));
                }
            } catch(e) {
                console.log(`[ЗВУК] Исключение: ${soundFile} - ${e.message}`);
            }
        }

        // ========== ПЕРЕКЛЮЧАТЕЛИ НА ЭКРАНЕ НАСТРОЕК ==========
        let fieldIndex = 0;
        const fieldImages = ['field-last', 'field-straight'];
        function updateField() {
            fieldImages.forEach((id, idx) => {
                const img = document.getElementById(id);
                if (img) {
                    if (idx === fieldIndex) img.classList.remove('hidden');
                    else img.classList.add('hidden');
                }
            });
            playSound('TurnSwitchSound.mp3');
        }
        document.getElementById('btn-field-left').addEventListener('click', () => {
            fieldIndex = (fieldIndex - 1 + fieldImages.length) % fieldImages.length;
            updateField();
        });
        document.getElementById('btn-field-right').addEventListener('click', () => {
            fieldIndex = (fieldIndex + 1) % fieldImages.length;
            updateField();
        });

        let playerIndex = 0;
        const playerImages = ['player-red', 'player-white', 'player-cases'];
        function updatePlayer() {
            playerImages.forEach((id, idx) => {
                const img = document.getElementById(id);
                if (img) {
                    if (idx === playerIndex) img.classList.remove('hidden');
                    else img.classList.add('hidden');
                }
            });
            playSound('TurnSwitchSound.mp3');
        }
        document.getElementById('btn-player-left').addEventListener('click', () => {
            playerIndex = (playerIndex - 1 + playerImages.length) % playerImages.length;
            updatePlayer();
        });
        document.getElementById('btn-player-right').addEventListener('click', () => {
            playerIndex = (playerIndex + 1) % playerImages.length;
            updatePlayer();
        });

        let soundIndex = 0;
        const soundImages = ['sound-on', 'sound-off'];
        function updateSound() {
            soundImages.forEach((id, idx) => {
                const img = document.getElementById(id);
                if (img) {
                    if (idx === soundIndex) img.classList.remove('hidden');
                    else img.classList.add('hidden');
                }
            });
            isSoundEnabled = (soundIndex === 0);
            playSound('TurnSwitchSound.mp3');
        }
        document.getElementById('btn-sound-left').addEventListener('click', () => {
            soundIndex = (soundIndex - 1 + soundImages.length) % soundImages.length;
            updateSound();
        });
        document.getElementById('btn-sound-right').addEventListener('click', () => {
            soundIndex = (soundIndex + 1) % soundImages.length;
            updateSound();
        });

        document.getElementById('btn-info').addEventListener('click', () => {
            playSound('OpenNewFormSound.mp3');
            switchScreen('screen_info');
        });

        // ========== ЛОГИРОВАНИЕ ==========
        const LOG_URL = 'https://script.google.com/macros/s/AKfycbylFYeOaTzjUX9STu_X-EGu8scGCGC7E6sDCSf6xgzKiGkJssr5N56Lre08E6yRMZv_-g/exec';

        let lastLogTime = Date.now();

        function sendLog(message, type = 'info') {
            const now = Date.now();
            const logEntry = {
                time: new Date().toISOString(),
                delta: (now - lastLogTime) / 1000,
                type: type,
                message: message,
                turnFlag: turnFlag,
                isComputerMode: isComputerMode,
                activeStones: stonesList ? stonesList.filter(s => s.active).length : 0,
                playerIndex: typeof playerIndex !== 'undefined' ? playerIndex : null,
                fieldIndex: typeof fieldIndex !== 'undefined' ? fieldIndex : null,
                isPhysicsRunning: isPhysicsRunning,
                gameLoopId: gameLoopId ? true : false
            };
            lastLogTime = now;

            fetch(LOG_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(logEntry)
            }).catch(e => console.log('Ошибка отправки лога:', e));
        }

        // ----- ПЕРЕМЕННЫЕ -----
        let activeCollisions = 0;
        let currentScale = 1;
        let isGameActive = false;
        let isComputerMode = false;
        
        let redLines = 0;
        let whiteLines = 0;
        let turnFlag = 1;
        let lastRoundStarter = 'red';
        
        function updateTurnIndicator() {
            const turnRed = document.getElementById('turn-red');
            const turnWhite = document.getElementById('turn-white');
            if (turnFlag === 1) {
                turnRed.classList.remove('hidden');
                turnWhite.classList.add('hidden');
            } else {
                turnRed.classList.add('hidden');
                turnWhite.classList.remove('hidden');
            }
        }

        // ----- ПАРАМЕТРЫ ШАШЕК И ПОЛЯ -----
        const STONE_SIZE = 75;
        const FIELD_WIDTH = 800;
        const FIELD_HEIGHT = 800;
        const BORDER = 5;
        const stonePositions = [-320, -222, -124, -26, 72, 170, 268, 365];
        
        const START_RED_Y = FIELD_HEIGHT - BORDER - STONE_SIZE / 2 - 15;
        const START_WHITE_Y = BORDER + STONE_SIZE / 2 + 15;                
        
        let currentRedY = START_RED_Y;
        let currentWhiteY = START_WHITE_Y;
        
        const LINE_HEIGHT = 98;
        const MIN_RED_Y = START_RED_Y - (7 * LINE_HEIGHT);
        const MAX_WHITE_Y = START_WHITE_Y + (7 * LINE_HEIGHT);
        
        let isResettingRound = false;
        let isComputerThinking = false;

        // ----- ФИЗИЧЕСКИЕ ПАРАМЕТРЫ -----
        const COLLISION_BOUNCE = 0.7;
        const FRICTION_AIR = 0.98;
        const FRICTION_GROUND = 0.996;
        const STOP_SPEED = 0.5;

        let stonesList = [];
        let gameLoopId = null;
        let isPhysicsRunning = false;

        // ----- СДВИГ ПОЛЯ -----
        let currentScrollPosition = 'center'; // 'left', 'center', 'right'
        const SCROLL_OFFSET = 350; // Величина сдвига в пикселях

        function updateScrollPosition() {
            const scrollContainer = document.getElementById('game-scroll-container');
            if (!scrollContainer) return;
            
            let translateX = 0;
            const containerWidth = scrollContainer.parentElement.clientWidth;
            const fieldWidth = 800;
            
            switch(currentScrollPosition) {
                case 'left':
                    translateX = -(containerWidth / 2 - fieldWidth / 2 - 10);
                    break;
                case 'center':
                    translateX = 0;
                    break;
                case 'right':
                    translateX = (containerWidth / 2 - fieldWidth / 2 - 10);
                    break;
            }
            
            scrollContainer.style.transform = `translateX(${translateX}px)`;
            console.log('Сдвиг поля:', currentScrollPosition, translateX);
        }

        class PhysicsStone {
            constructor(element, team, x, y) {
                this.element = element;
                this.team = team;
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.radius = STONE_SIZE / 2;
                this.active = true;
            }
            
            applyImpulse(vx, vy) {
                this.vx = vx;
                this.vy = vy;
            }
            
            updatePosition() {
                if (!this.active) return;
                this.vx *= FRICTION_AIR * FRICTION_GROUND;
                this.vy *= FRICTION_AIR * FRICTION_GROUND;
                if (Math.abs(this.vx) < STOP_SPEED && Math.abs(this.vy) < STOP_SPEED) {
                    this.vx = 0;
                    this.vy = 0;
                }
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.isOutOfBounds()) {
                    this.active = false;
                    this.element.style.display = 'none';
                    console.log(`${this.team} шашка вылетела`);
                    updateScores();
                    return;
                }
                
                this.element.style.left = `${this.x - this.radius}px`;
                this.element.style.top = `${this.y - this.radius}px`;
            }
            
            isOutOfBounds() {
                const leftBound = BORDER;
                const rightBound = FIELD_WIDTH - BORDER;
                const topBound = BORDER;
                const bottomBound = FIELD_HEIGHT - BORDER;
                return (this.x < leftBound || this.x > rightBound || this.y < topBound || this.y > bottomBound);
            }
        }

        function handleCollision(s1, s2) {
            if (!s1.active || !s2.active) return;
            const dx = s1.x - s2.x;
            const dy = s1.y - s2.y;
            const distance = Math.hypot(dx, dy);
            const minDist = s1.radius + s2.radius;
            
            if (distance < minDist) {
                if (distance > 1) {
                    console.log(`[СТОЛКНОВЕНИЕ] ${s1.team} и ${s2.team}, расстояние: ${distance.toFixed(2)}`);
                    sendLog(`COLLISION ${s1.team} vs ${s2.team} dist=${distance.toFixed(2)}`, 'collision');
                    playSound('BeatSound.mp3');
                }
                
                const angle = Math.atan2(dy, dx);
                const overlap = minDist - distance;
                const moveX = Math.cos(angle) * overlap * 0.5;
                const moveY = Math.sin(angle) * overlap * 0.5;
                s1.x += moveX;
                s1.y += moveY;
                s2.x -= moveX;
                s2.y -= moveY;
                s1.element.style.left = `${s1.x - s1.radius}px`;
                s1.element.style.top = `${s1.y - s1.radius}px`;
                s2.element.style.left = `${s2.x - s2.radius}px`;
                s2.element.style.top = `${s2.y - s2.radius}px`;
                const nx = dx / distance;
                const ny = dy / distance;
                const vrelx = s1.vx - s2.vx;
                const vrely = s1.vy - s2.vy;
                const imp = (1 + COLLISION_BOUNCE) * (vrelx * nx + vrely * ny) / 2;
                s1.vx -= imp * nx;
                s1.vy -= imp * ny;
                s2.vx += imp * nx;
                s2.vy += imp * ny;
            }
        }

        function updateScores() {
            let redOnField = 0, whiteOnField = 0, redDead = 0, whiteDead = 0;
            stonesList.forEach(stone => {
                if (stone.team === 'red') {
                    if (stone.active) redOnField++;
                    else redDead++;
                } else {
                    if (stone.active) whiteOnField++;
                    else whiteDead++;
                }
            });
            const redScoreElem = document.getElementById('red-score');
            const whiteScoreElem = document.getElementById('white-score');
            if (redScoreElem) redScoreElem.textContent = `${redOnField}/${redDead}`;
            if (whiteScoreElem) whiteScoreElem.textContent = `${whiteOnField}/${whiteDead}`;
        }

        function placeStonesWithOffset(redY, whiteY) {
            const container = document.getElementById('stones-container');
            if (!container) return;
            container.innerHTML = '';
            const centerX = FIELD_WIDTH / 2 - STONE_SIZE / 4;
            stonePositions.forEach(offsetX => {
                container.appendChild(createStone('red', centerX + offsetX, redY));
            });
            stonePositions.forEach(offsetX => {
                container.appendChild(createStone('white', centerX + offsetX, whiteY));
            });
            initPhysics();
            updateScores();
        }

        function initPhysics() {
            stonesList = [];
            const stones = document.querySelectorAll('#stones-container .stone');
            stones.forEach(stone => {
                const x = parseFloat(stone.style.left) + STONE_SIZE / 2;
                const y = parseFloat(stone.style.top) + STONE_SIZE / 2;
                const team = stone.dataset.team;
                stonesList.push(new PhysicsStone(stone, team, x, y));
            });
            updateScores();
        }

        function updatePhysics() {
            for (let stone of stonesList) stone.updatePosition();
            for (let i = 0; i < stonesList.length; i++)
                for (let j = i + 1; j < stonesList.length; j++)
                    handleCollision(stonesList[i], stonesList[j]);
            
            let allStopped = true;
            for (let stone of stonesList) {
                if (stone.active && (Math.abs(stone.vx) > STOP_SPEED || Math.abs(stone.vy) > STOP_SPEED)) {
                    allStopped = false;
                    break;
                }
            }
            
            if (allStopped && isPhysicsRunning) {
                if (gameLoopId) {
                    cancelAnimationFrame(gameLoopId);
                    gameLoopId = null;
                }
                isPhysicsRunning = false;
                console.log('Все шашки остановились');
                
                let redActive = false, whiteActive = false;
                for (let stone of stonesList) {
                    if (stone.active) {
                        if (stone.team === 'red') redActive = true;
                        else whiteActive = true;
                    }
                }
                
                if ((redActive && !whiteActive) || (!redActive && whiteActive) || (!redActive && !whiteActive)) {
                    
                    let winner = null;
                    if (redActive && !whiteActive) winner = 'red';
                    else if (!redActive && whiteActive) winner = 'white';
                    else if (!redActive && !whiteActive) winner = 'draw';
                    
                    console.log(`Раунд окончен! Победитель: ${winner}`);
                    
                    if (winner === 'draw') {
                        console.log('НИЧЬЯ — перезапускаем раунд');
                        playSound('DrawRound.mp3');
                        placeStonesWithOffset(currentRedY, currentWhiteY);
                        turnFlag = (lastRoundStarter === 'red') ? 1 : 0;
                        updateTurnIndicator();
                        
                        setTimeout(() => {
                            if (isComputerMode && turnFlag === 0 && !isComputerThinking && isGameActive) {
                                console.log('Компьютер делает ход после ничьей');
                                makeComputerMove();
                            }
                        }, 100);
                        
                    } else if (winner === 'red') {
                        currentRedY -= LINE_HEIGHT;
                        redLines++;
                        if (currentWhiteY > START_WHITE_Y) {
                            currentWhiteY -= LINE_HEIGHT;
                            whiteLines--;
                        }
                        turnFlag = 0;
                        lastRoundStarter = 'white';
                        updateTurnIndicator();
                        
                        currentRedY = Math.max(MIN_RED_Y, Math.min(START_RED_Y, currentRedY));
                        currentWhiteY = Math.max(START_WHITE_Y, Math.min(MAX_WHITE_Y, currentWhiteY));
                        
                        if (redLines >= 7) {
                            playSound('WinSound.mp3');
                            setTimeout(() => switchScreen('screen_final_win'), 2000);
                            return;
                        }
                        
                        playSound('EndRoundSound.mp3');
                        placeStonesWithOffset(currentRedY, currentWhiteY);
                        
                        setTimeout(() => {
                            if (isComputerMode && turnFlag === 0 && !isComputerThinking && isGameActive) {
                                console.log('Компьютер делает ход после победы красных');
                                makeComputerMove();
                            }
                        }, 100);
                        
                    } else if (winner === 'white') {
                        currentWhiteY += LINE_HEIGHT;
                        whiteLines++;
                        if (currentRedY < START_RED_Y) {
                            currentRedY += LINE_HEIGHT;
                            redLines--;
                        }
                        turnFlag = 1;
                        lastRoundStarter = 'red';
                        updateTurnIndicator();
                        
                        currentRedY = Math.max(MIN_RED_Y, Math.min(START_RED_Y, currentRedY));
                        currentWhiteY = Math.max(START_WHITE_Y, Math.min(MAX_WHITE_Y, currentWhiteY));
                        
                        if (whiteLines >= 7) {
                            playSound('LoseSound.mp3');
                            setTimeout(() => switchScreen('screen_final_win'), 2000);
                            return;
                        }
                        
                        playSound('EndRoundSound.mp3');
                        placeStonesWithOffset(currentRedY, currentWhiteY);
                    }
                    
                    setTimeout(() => {
                        isResettingRound = false;
                    }, 100);
                } else {
                    console.log('Нет победителя, продолжаем игру');
                    if (isComputerMode && turnFlag === 0 && !isComputerThinking && isGameActive) {
                        console.log('Компьютер делает ход');
                        makeComputerMove();
                    }
                }
            }
        }

        function startPhysics() {
            if (gameLoopId) {
                cancelAnimationFrame(gameLoopId);
                gameLoopId = null;
            }
            console.log("startPhysics вызван");
            isPhysicsRunning = true;
            isGameActive = true;
            function loop() {
                if (!isGameActive) return;
                updatePhysics();
                gameLoopId = requestAnimationFrame(loop);
            }
            gameLoopId = requestAnimationFrame(loop);
        }

        function stopPhysics() {
            if (gameLoopId) {
                cancelAnimationFrame(gameLoopId);
                gameLoopId = null;
            }
            isPhysicsRunning = false;
            isGameActive = false;
        }

        // ========== ХОД КОМПЬЮТЕРА ==========
        function makeComputerMove() {
            if (!isComputerMode) return;
            if (isResettingRound) return;
            if (turnFlag !== 0) return;
            if (isComputerThinking) return;
            if (!isGameActive) return;
            
            let whiteStones = stonesList.filter(s => s.team === 'white' && s.active);
            if (whiteStones.length === 0) {
                console.log("У компьютера нет шашек для хода");
                return;
            }
            
            isComputerThinking = true;
            console.log("Компьютер обдумывает ход...");
            sendLog(`COMPUTER MOVE START`, 'ai');
            
            let bestScore = -Infinity;
            let bestMove = null;
            
            const angles = [];
            for (let deg = 0; deg < 360; deg += 45) {
                angles.push(deg * Math.PI / 180);
            }
            
            const powers = [];
            for (let p = 5; p <= 25; p += 5) {
                powers.push(p);
            }
            
            function deepSimulateShot(stone, angleRad, power) {
                let simStones = [];
                for (let s of stonesList) {
                    simStones.push({
                        team: s.team,
                        x: s.x,
                        y: s.y,
                        vx: s.vx,
                        vy: s.vy,
                        radius: s.radius,
                        active: s.active
                    });
                }
                
                let simStone = simStones.find((s, idx) => {
                    const originalStone = stonesList[idx];
                    return originalStone.element === stone.element;
                });
                if (!simStone || !simStone.active) return { redDead: 0, whiteDead: 0 };
                
                let velX = -Math.cos(angleRad) * power;
                let velY = -Math.sin(angleRad) * power;
                simStone.vx = velX;
                simStone.vy = velY;
                
                const FRICTION_AIR_SIM = 0.98;
                const FRICTION_GROUND_SIM = 0.996;
                const STOP_SPEED_SIM = 0.5;
                const COLLISION_BOUNCE_SIM = 0.7;
                
                function isOutOfBounds(stone) {
                    const leftBound = BORDER;
                    const rightBound = FIELD_WIDTH - BORDER;
                    const topBound = BORDER;
                    const bottomBound = FIELD_HEIGHT - BORDER;
                    return (stone.x < leftBound || stone.x > rightBound || stone.y < topBound || stone.y > bottomBound);
                }
                
                function handleCollisionSim(s1, s2) {
                    if (!s1.active || !s2.active) return;
                    const dx = s1.x - s2.x;
                    const dy = s1.y - s2.y;
                    const distance = Math.hypot(dx, dy);
                    const minDist = s1.radius + s2.radius;
                    if (distance < minDist) {
                        const angle = Math.atan2(dy, dx);
                        const overlap = minDist - distance;
                        const moveX = Math.cos(angle) * overlap * 0.5;
                        const moveY = Math.sin(angle) * overlap * 0.5;
                        s1.x += moveX;
                        s1.y += moveY;
                        s2.x -= moveX;
                        s2.y -= moveY;
                        const nx = dx / distance;
                        const ny = dy / distance;
                        const vrelx = s1.vx - s2.vx;
                        const vrely = s1.vy - s2.vy;
                        const imp = (1 + COLLISION_BOUNCE_SIM) * (vrelx * nx + vrely * ny) / 2;
                        s1.vx -= imp * nx;
                        s1.vy -= imp * ny;
                        s2.vx += imp * nx;
                        s2.vy += imp * ny;
                    }
                }
                
                let redDead = 0;
                let whiteDead = 0;
                
                for (let step = 0; step < 2000; step++) {
                    for (let s of simStones) {
                        if (!s.active) continue;
                        s.vx *= FRICTION_AIR_SIM * FRICTION_GROUND_SIM;
                        s.vy *= FRICTION_AIR_SIM * FRICTION_GROUND_SIM;
                        if (Math.abs(s.vx) < STOP_SPEED_SIM && Math.abs(s.vy) < STOP_SPEED_SIM) {
                            s.vx = 0;
                            s.vy = 0;
                        }
                        s.x += s.vx;
                        s.y += s.vy;
                        
                        if (isOutOfBounds(s)) {
                            s.active = false;
                            if (s.team === 'red') redDead++;
                            else if (s.team === 'white') whiteDead++;
                            continue;
                        }
                    }
                    
                    for (let i = 0; i < simStones.length; i++) {
                        for (let j = i + 1; j < simStones.length; j++) {
                            handleCollisionSim(simStones[i], simStones[j]);
                        }
                    }
                    
                    let allStopped = true;
                    for (let s of simStones) {
                        if (s.active && (Math.abs(s.vx) > STOP_SPEED_SIM || Math.abs(s.vy) > STOP_SPEED_SIM)) {
                            allStopped = false;
                            break;
                        }
                    }
                    if (allStopped) break;
                }
                
                return { redDead, whiteDead };
            }
            
            for (let stone of whiteStones) {
                for (let angle of angles) {
                    for (let power of powers) {
                        const result = deepSimulateShot(stone, angle, power);
                        const redDead = result.redDead;
                        const whiteDead = result.whiteDead;
                        
                        let score = (redDead * 100) - (whiteDead * 50);
                        if (redDead === 0) score -= 30;
                        
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove = { stone, angle, power };
                        }
                    }
                }
            }
            
            let selectedStone, selectedAngle, selectedPower;
            
            if (bestMove && bestScore > -Infinity) {
                selectedStone = bestMove.stone;
                selectedAngle = bestMove.angle;
                selectedPower = bestMove.power;
                console.log(`Компьютер выбрал удар: сила ${selectedPower}, угол ${Math.round(selectedAngle * 180 / Math.PI)}°`);
            } else {
                selectedStone = whiteStones[Math.floor(Math.random() * whiteStones.length)];
                selectedAngle = Math.random() * 2 * Math.PI;
                selectedPower = 8 + Math.random() * 14;
                console.log("Компьютер делает случайный ход");
            }
            
            let velX = -Math.cos(selectedAngle) * selectedPower;
            let velY = -Math.sin(selectedAngle) * selectedPower;
            
            selectedStone.applyImpulse(velX, velY);
            
            if (gameLoopId) {
                cancelAnimationFrame(gameLoopId);
                gameLoopId = null;
            }
            
            startPhysics();
            
            turnFlag = 1;
            updateTurnIndicator();
            console.log(`Компьютер выстрелил. Теперь ход красных (игрок)`);
            
            isComputerThinking = false;
        }         
        
        // ========== ПРИЦЕЛ И ВЫСТРЕЛ ИГРОКА ==========
        let isDragging = false;
        let selectedStone = null;
        let dragStartX = 0, dragStartY = 0;
        let aimLine = null;
        let currentStone = null;

        function createAimLine(x, y, angle, length, stoneWidth) {
            if (aimLine) aimLine.remove();
            const container = document.getElementById('game-board-container');
            if (!container) return;
            
            const scaledX = x / currentScale;
            const scaledY = y / currentScale;
            const scaledLength = length / currentScale;
            const startWidth = stoneWidth;
            
            const canvas = document.createElement('canvas');
            canvas.classList.add('aim-line');
            const lineLength = Math.min(400, Math.max(50, scaledLength));
            
            canvas.width = lineLength;
            canvas.height = startWidth;
            
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0, '#ff0000');
            gradient.addColorStop(1, '#ff8888');
            
            const baseWidth = startWidth * 0.9;
            
            ctx.beginPath();
            ctx.moveTo(0, startWidth / 2 - baseWidth / 2);
            ctx.lineTo(canvas.width, startWidth / 2 - 2);
            ctx.lineTo(canvas.width, startWidth / 2 + 2);
            ctx.lineTo(0, startWidth / 2 + baseWidth / 2);
            ctx.closePath();
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            canvas.style.position = 'absolute';
            canvas.style.left = `${scaledX}px`;
            canvas.style.top = `${scaledY - startWidth / 2}px`;
            canvas.style.transform = `rotate(${angle}rad)`;
            canvas.style.transformOrigin = `0px ${startWidth / 2}px`;
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '100';
            
            container.appendChild(canvas);
            aimLine = canvas;
        }
        
        function removeAimLine() { 
            if (aimLine) { 
                aimLine.remove(); 
                aimLine = null; 
            } 
        }

        function onStoneMouseDown(event, stoneElement) {
            event.preventDefault();
            event.stopPropagation();
            if (!isGameActive) return;
            if (isResettingRound) return;
            
            const stoneTeam = stoneElement.dataset.team;
            if ((turnFlag === 1 && stoneTeam !== 'red') || (turnFlag === 0 && stoneTeam !== 'white')) {
                console.log(`Сейчас ход ${turnFlag === 1 ? 'красных' : 'белых'}`);
                return;
            }
            
            isDragging = true;
            selectedStone = stoneElement;
            currentStone = stoneElement;
            const containerRect = document.getElementById('game-board-container').getBoundingClientRect();
            const stoneRect = stoneElement.getBoundingClientRect();
            dragStartX = stoneRect.left + stoneRect.width / 2 - containerRect.left;
            dragStartY = stoneRect.top + stoneRect.height / 2 - containerRect.top;
            console.log('Захват шашки');
        }

        function onGlobalMouseMove(event) {
            if (!isGameActive) return;
            if (!isDragging || !selectedStone) return;
            event.preventDefault();
            const containerRect = document.getElementById('game-board-container').getBoundingClientRect();
            let clientX, clientY;
            if (event.touches) { 
                clientX = event.touches[0].clientX; 
                clientY = event.touches[0].clientY; 
            } else { 
                clientX = event.clientX; 
                clientY = event.clientY; 
            }
            const currentX = clientX - containerRect.left;
            const currentY = clientY - containerRect.top;
            const dx = currentX - dragStartX;
            const dy = currentY - dragStartY;
            const MAX_ARROW_LENGTH = 150;
            let distance = Math.hypot(dx, dy);
            if (distance > MAX_ARROW_LENGTH) distance = MAX_ARROW_LENGTH;
            let angle = Math.atan2(dy, dx);
            angle += Math.PI;
            createAimLine(dragStartX, dragStartY, angle, distance * 2, STONE_SIZE);
        }

        function onGlobalMouseUp(event) {
            if (!isGameActive) {
                removeAimLine();
                isDragging = false;
                selectedStone = null;
                return;
            }
            if (!isDragging || !selectedStone) {
                removeAimLine();
                isDragging = false;
                selectedStone = null;
                return;
            }
            event.preventDefault();
            
            const stoneTeam = selectedStone.dataset.team;
            if ((turnFlag === 1 && stoneTeam !== 'red') || (turnFlag === 0 && stoneTeam !== 'white')) {
                removeAimLine();
                isDragging = false;
                selectedStone = null;
                return;
            }
            
            const containerRect = document.getElementById('game-board-container').getBoundingClientRect();
            let clientX, clientY;
            if (event.changedTouches) { 
                clientX = event.changedTouches[0].clientX; 
                clientY = event.changedTouches[0].clientY; 
            } else { 
                clientX = event.clientX; 
                clientY = event.clientY; 
            }
            const currentX = clientX - containerRect.left;
            const currentY = clientY - containerRect.top;
            const dx = currentX - dragStartX;
            const dy = currentY - dragStartY;
            const MAX_ARROW_LENGTH = 150;
            let distance = Math.hypot(dx, dy);
            if (distance > MAX_ARROW_LENGTH) distance = MAX_ARROW_LENGTH;
            const power = Math.min(35, distance / 4);
            console.log(`[ВЫСТРЕЛ] Длина линии: ${distance.toFixed(2)}px, Сила удара: ${power.toFixed(2)}`);
            sendLog(`SHOT distance=${distance.toFixed(2)} power=${power.toFixed(2)}`, 'shot');
            
            if (power > 1) {
                const angle = Math.atan2(dy, dx);
                const velocityX = -Math.cos(angle) * power;
                const velocityY = -Math.sin(angle) * power;
                const stoneObj = stonesList.find(s => s.element === selectedStone);
                if (stoneObj && stoneObj.active) {
                    stoneObj.applyImpulse(velocityX, velocityY);
                    startPhysics();
                    console.log(`Выстрел! Сила: ${power}`);
                    turnFlag = turnFlag === 1 ? 0 : 1;
                    updateTurnIndicator();
                }
            }
            removeAimLine();
            isDragging = false;
            selectedStone = null;
        }

        function createStone(team, x, y) {
            const stoneDiv = document.createElement('div');
            stoneDiv.className = 'stone';
            stoneDiv.style.width = `${STONE_SIZE}px`;
            stoneDiv.style.height = `${STONE_SIZE}px`;
            stoneDiv.style.left = `${x - STONE_SIZE / 2}px`;
            stoneDiv.style.top = `${y - STONE_SIZE / 2}px`;
            const img = document.createElement('img');
            img.src = `assets/images/${team === 'red' ? 'Shashka_red.png' : 'Shashka_white.png'}`;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.display = 'block';
            stoneDiv.appendChild(img);
            stoneDiv.dataset.team = team;
            stoneDiv.addEventListener('mousedown', (e) => onStoneMouseDown(e, stoneDiv));
            stoneDiv.addEventListener('touchstart', (e) => onStoneMouseDown(e, stoneDiv));
            return stoneDiv;
        }

        function placeStones() {
            const container = document.getElementById('stones-container');
            if (!container) return;
            container.innerHTML = '';
            const centerX = FIELD_WIDTH / 2 - STONE_SIZE / 4;
            stonePositions.forEach(offsetX => {
                container.appendChild(createStone('red', centerX + offsetX, currentRedY));
            });
            stonePositions.forEach(offsetX => {
                container.appendChild(createStone('white', centerX + offsetX, currentWhiteY));
            });
            updateScores();
        }

        window.addEventListener('mousemove', onGlobalMouseMove);
        window.addEventListener('mouseup', onGlobalMouseUp);
        window.addEventListener('touchmove', onGlobalMouseMove);
        window.addEventListener('touchend', onGlobalMouseUp);

        placeStones();
        initPhysics();

        // Обработчики сдвига поля
        document.getElementById('btn-move-left').addEventListener('click', () => {
            if (currentScrollPosition === 'right') {
                currentScrollPosition = 'center';
            } else if (currentScrollPosition === 'center') {
                currentScrollPosition = 'left';
            }
            updateScrollPosition();
        });
        
        document.getElementById('btn-move-right').addEventListener('click', () => {
            if (currentScrollPosition === 'left') {
                currentScrollPosition = 'center';
            } else if (currentScrollPosition === 'center') {
                currentScrollPosition = 'right';
            }
            updateScrollPosition();
        });

        document.getElementById('btn-to-fight').addEventListener('click', () => {
            playSound('OpenNewFormSound.mp3');
            
            isComputerMode = (fieldIndex === 1);
            console.log(`Режим игры: ${isComputerMode ? 'Против компьютера' : 'Два игрока'}`);
            
            currentScrollPosition = 'center';
            updateScrollPosition();
            
            currentRedY = START_RED_Y;
            currentWhiteY = START_WHITE_Y;
            isResettingRound = false;
            redLines = 0;
            whiteLines = 0;
            isComputerThinking = false;
            
            if (playerIndex === 0) {
                turnFlag = 1;
                lastRoundStarter = 'red';
            } else if (playerIndex === 1) {
                turnFlag = 0;
                lastRoundStarter = 'white';
            } else {
                turnFlag = Math.random() < 0.5 ? 1 : 0;
                lastRoundStarter = turnFlag === 1 ? 'red' : 'white';
            }
            updateTurnIndicator();
            
            placeStonesWithOffset(START_RED_Y, START_WHITE_Y);
            isGameActive = true;
            switchScreen('screen_game');
        });

        document.getElementById('btn-resume').addEventListener('click', () => {
            playSound('OpenNewFormSound.mp3');
            
            if (gameLoopId) {
                cancelAnimationFrame(gameLoopId);
                gameLoopId = null;
            }
            isPhysicsRunning = false;
            
            currentScrollPosition = 'center';
            updateScrollPosition();
            
            currentRedY = START_RED_Y;
            currentWhiteY = START_WHITE_Y;
            isResettingRound = false;
            redLines = 0;
            whiteLines = 0;
            isComputerThinking = false;
            
            if (playerIndex === 0) {
                turnFlag = 1;
                lastRoundStarter = 'red';
            } else if (playerIndex === 1) {
                turnFlag = 0;
                lastRoundStarter = 'white';
            } else {
                turnFlag = Math.random() < 0.5 ? 1 : 0;
                lastRoundStarter = turnFlag === 1 ? 'red' : 'white';
            }
            updateTurnIndicator();
            
            placeStones();
            initPhysics();
            
            console.log('Перезапуск сражения');
        });

        document.getElementById('btn-to-menu').addEventListener('click', () => {
            playSound('OpenNewFormSound.mp3');
            stopPhysics();
            switchScreen('screen_settings');
        });
        document.getElementById('btn-win-to-menu').addEventListener('click', () => {
            playSound('OpenNewFormSound.mp3');
            stopPhysics();
            switchScreen('screen_settings');
        });
        document.getElementById('btn-lost-to-menu').addEventListener('click', () => {
            playSound('OpenNewFormSound.mp3');
            stopPhysics();
            switchScreen('screen_settings');
        });
        document.getElementById('btn-info-to-menu').addEventListener('click', () => {
            playSound('OpenNewFormSound.mp3');
            stopPhysics();
            switchScreen('screen_settings');
        });
        
        // Обновляем сдвиг при изменении размера экрана
        window.addEventListener('resize', () => {
            updateScrollPosition();
        });
    </script>
    <script>
        function fitGameToScreen() {
            const container = document.getElementById('game-container');
            if (!container) return;
            
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const gameWidth = 1080;
            const gameHeight = 2400;
            
            const scaleX = screenWidth / gameWidth;
            const scaleY = screenHeight / gameHeight;
            currentScale = Math.min(scaleX, scaleY);
            
            container.style.transform = `scale(${currentScale})`;
            container.style.transformOrigin = 'top left';
            container.style.width = `${gameWidth}px`;
            container.style.height = `${gameHeight}px`;
            
            const scaledWidth = gameWidth * currentScale;
            const scaledHeight = gameHeight * currentScale;
            container.style.position = 'absolute';
            container.style.left = `${(screenWidth - scaledWidth) / 2}px`;
            container.style.top = `${(screenHeight - scaledHeight) / 2}px`;
        }
        
        window.addEventListener('load', fitGameToScreen);
        window.addEventListener('resize', fitGameToScreen);
    </script>
